name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-go:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: make deps

      - name: Run Go formatting check
        run: |
          make fmt
          if [ -n "$(git status --porcelain)" ]; then
            echo "Go files are not formatted. Please run 'make fmt'"
            git diff
            exit 1
          fi

      - name: Run Go linter
        run: make lint
        env:
          GOLANGCI_LINT_VERSION: v2.5.0

  vuln-go:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  dep-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Non-blocking: the action requires the repo-level Dependency graph
    # feature to be enabled (Settings → Security → Dependency graph).
    # Until that's flipped on, the action errors with "Dependency review
    # is not supported on this repository". Leaving the job advisory so
    # CI stays green on private/personal repos that haven't opted in;
    # the moment the feature is enabled, real findings start failing PRs.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Flags newly-introduced dependency vulnerabilities + license issues on
      # PRs. Complements govulncheck (which scans the whole module graph
      # on every run) by catching them at the diff level.
      - name: Run dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  sast-gosec:
    name: SAST (gosec, SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run gosec
        uses: securego/gosec@master
        with:
          # -no-fail: report findings without failing the job — the
          # SARIF upload feeds the GitHub Security tab where branch
          # protection / code-scanning rules can gate merges. Real
          # blocking happens in the lint-go job, which also runs gosec
          # via golangci-lint v2.
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  codeql-go:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality

      # CodeQL needs a build to analyze; reuse our normal Go build,
      # skipping the web bundle since the JS is analyzed separately.
      - name: Build
        run: make build-go

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-go

  test-go:
    name: Test Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: make deps

      - name: Run tests with race detector + coverage
        run: make test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build-ui:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Vitest
        run: npm run test
        working-directory: web

      - name: Type-check + build
        run: npm run build
        working-directory: web

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  validate-openapi:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@^1

      - name: Lint api/openapi.yaml
        run: redocly lint api/openapi.yaml

  validate-helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: helm lint (default values)
        run: helm lint charts/pgao

      - name: helm lint (sample CI values)
        run: helm lint charts/pgao -f charts/pgao/ci/sample-values.yaml

      - name: helm template (sample CI values)
        run: helm template pgao charts/pgao -f charts/pgao/ci/sample-values.yaml > /tmp/pgao-rendered.yaml

      - name: kubeconform (k8s 1.30)
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            -kubernetes-version 1.30.0 /tmp/pgao-rendered.yaml

  lint-terraform:
    name: Lint Terraform Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Initialize Terraform
        run: make terraform-init

      - name: Check Terraform formatting
        run: |
          make terraform-fmt
          if [ -n "$(git status --porcelain)" ]; then
            echo "Terraform files are not formatted. Please run 'make terraform-fmt'"
            git diff
            exit 1
          fi

      - name: Run Terraform linting
        run: make terraform-lint

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [lint-go, test-go, vuln-go, build-ui]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download web bundle from build-ui
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Download dependencies
        run: make deps

      # Use build-go (no npm) — the bundle just landed via the artifact.
      - name: Build binary
        run: make build-go

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgao-binary
          path: bin/pgao
          retention-days: 7

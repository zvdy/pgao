name: Extension (pg_regress)

on:
  push:
    branches: [main, develop]
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'

permissions:
  contents: read

jobs:
  pg-regress:
    name: pg_regress (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17]
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }} + server-dev
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -y
          sudo apt-get install -y postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }}

      - name: Build + install pgao extension
        run: |
          cd extension
          make PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          sudo make install PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Run pg_regress
        run: |
          sudo chown -R postgres:postgres extension
          sudo -u postgres make -C extension installcheck PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Dump regression.diffs on failure
        if: failure()
        run: |
          cat extension/regression.diffs || true
          cat extension/log/initdb.log || true

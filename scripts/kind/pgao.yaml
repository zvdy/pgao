---
apiVersion: v1
kind: Namespace
metadata:
  name: pgao
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgao-config
  namespace: pgao
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      read_timeout: 15s
      write_timeout: 15s
      idle_timeout: 60s
    clusters:
      - id: "integration-test"
        name: "Integration Test"
        host: "postgres.postgres.svc.cluster.local"
        port: 5432
        user: "pgao"
        password: "${DATABASE_PASSWORD}"
        database: "pgao_test"
        ssl_mode: "disable"
        max_connections: 5
        min_connections: 1
        conn_max_lifetime: 30m
        conn_max_idle_time: 5m
    logging:
      level: "info"
      format: "json"
      output: "stdout"
    metrics:
      collection_interval: 5s
      retention_days: 1
      enable_prometheus: true
      prometheus_port: 9090
---
apiVersion: v1
kind: Secret
metadata:
  name: pgao-db-credentials
  namespace: pgao
type: Opaque
stringData:
  DATABASE_PASSWORD: pgao_test_password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgao
  namespace: pgao
  labels:
    app: pgao
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgao
  template:
    metadata:
      labels:
        app: pgao
    spec:
      containers:
        - name: pgao
          image: pgao:integration
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: /etc/pgao/config.yaml
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgao-db-credentials
                  key: DATABASE_PASSWORD
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/pgao
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: pgao-config
---
apiVersion: v1
kind: Service
metadata:
  name: pgao
  namespace: pgao
spec:
  type: NodePort
  selector:
    app: pgao
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

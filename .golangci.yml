version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.25"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unused
  exclusions:
    paths:
      - bin
      - terraform
      - scripts
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocyclo
          - gosec
  settings:
    gocyclo:
      min-complexity: 18
    gosec:
      excludes:
        - G104
        - G304   # config path comes from CONFIG_PATH / a default, not user input
        - G404
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003"]

formatters:
  enable:
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

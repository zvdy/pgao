# PostgreSQL Analytics Observer Configuration
# Copy this file to config.yaml and customize for your environment

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  # Per-request deadline applied to all /api/v1/* handlers.
  request_timeout: 5s
  # Hard cap on request body size (bytes). Bigger bodies get 413.
  max_body_bytes: 1048576
  # Process-wide token bucket for /api/v1/*. Set to 0 to disable.
  rate_limit_rps: 50
  rate_limit_burst: 100
  # Total grace period for SIGTERM: HTTP drain + background collector
  # drain. Should be <= the orchestrator's terminationGracePeriodSeconds
  # (k8s default: 30s) so the runtime doesn't SIGKILL pgao mid-drain.
  shutdown_timeout: 25s
  # Optional static API key. When set, /api/v1/* requires either
  # Authorization: Bearer <key> or X-API-Key: <key>. /health, /ready,
  # and /metrics are always open. Leave empty for dev.
  auth:
    api_key: "${PGAO_API_KEY}"

# Database clusters to monitor
clusters:
  - id: "prod-cluster-1"
    name: "Production Cluster 1"
    host: "postgres-prod-1.example.com"
    port: 5432
    user: "pgao_monitor"
    password: "${DATABASE_PASSWORD}"
    database: "postgres"
    # ssl_mode is the libpq mode: disable | allow | prefer | require |
    # verify-ca | verify-full. verify-full is the recommended setting
    # whenever pgao is talking over an untrusted network.
    ssl_mode: "verify-full"
    # TLS material for verify-ca / verify-full + optional mTLS auth.
    # Paths are read once at startup; restart pgao after rotating certs.
    ssl_root_cert: "/etc/pgao-tls/prod/ca.crt"
    ssl_cert: "/etc/pgao-tls/prod/tls.crt"
    ssl_key: "/etc/pgao-tls/prod/tls.key"
    # Override the SNI / cert-verification hostname when connecting via
    # an LB whose DNS doesn't match the server cert (e.g. RDS proxy).
    # ssl_server_name: "prod.cluster-abc.us-east-1.rds.amazonaws.com"
    max_connections: 25
    min_connections: 5
    conn_max_lifetime: 1h
    conn_max_idle_time: 30m
    region: "us-east-1"
    environment: "production"
    tags:
      team: "platform"
      cost_center: "engineering"

  - id: "dev-cluster-1"
    name: "Development Cluster 1"
    host: "postgres-dev-1.example.com"
    port: 5432
    user: "pgao_monitor"
    password: "${DATABASE_PASSWORD}"
    database: "postgres"
    ssl_mode: "prefer"
    max_connections: 10
    min_connections: 2
    conn_max_lifetime: 1h
    conn_max_idle_time: 30m
    region: "us-east-1"
    environment: "development"
    tags:
      team: "platform"

logging:
  level: "info"  # debug, info, warn, error, fatal
  format: "json"  # json or text
  output: "stdout"  # stdout, stderr, or file path

metrics:
  collection_interval: 60s
  retention_days: 30
  enable_prometheus: true
  prometheus_port: 9090
  # Cap applied per cluster on every collection round. A hung Postgres
  # cancels at this deadline and never blocks the other clusters.
  query_timeout: 10s
  # Cadence of the connection supervisor's health probe while a cluster
  # is reported healthy. Unhealthy clusters use jittered exponential
  # backoff (5 s -> 60 s).
  health_check_interval: 30s

aws:
  region: "us-east-1"
  # access_key_id and secret_access_key can be provided via environment variables
  # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
  assume_role_arn: ""  # Optional: ARN of role to assume
  accounts:
    - "123456789012"
    - "987654321098"

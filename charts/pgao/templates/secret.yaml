{{/*
Auth secret. Only rendered when the operator passed an inline apiKey AND
did NOT specify an existingSecret. The preferred path is to manage the
secret externally (sealed-secrets, external-secrets, sops) and reference
it via auth.existingSecret.
*/}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- if not .Values.auth.apiKey }}
{{- fail "auth.enabled is true but neither auth.existingSecret nor auth.apiKey is set" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgao.authSecretName" . }}
  labels: {{- include "pgao.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.apiKey | quote }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgao.fullname" . }}
  labels: {{- include "pgao.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "pgao.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "pgao.labels" . | nindent 8 }}
      annotations:
        # Force a rollout when the rendered config or auth secret changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.auth.enabled }}
        checksum/auth: {{ include "pgao.authSecretName" . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pgao.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: pgao
          image: {{ include "pgao.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port }}
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: /etc/pgao/config.yaml
            {{- if .Values.auth.enabled }}
            - name: PGAO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pgao.authSecretName" . }}
                  key: {{ .Values.auth.secretKey }}
            {{- end }}
            {{- range $i, $c := .Values.clusters }}
            - name: {{ printf "PGAO_PG_PASSWORD_%s" (upper (replace "-" "_" $c.id)) }}
              valueFrom:
                secretKeyRef:
                  name: {{ required (printf "clusters[%d].existingPasswordSecret is required" $i) $c.existingPasswordSecret }}
                  key: {{ default "password" $c.passwordSecretKey }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/pgao
              readOnly: true
            {{- range $i, $c := .Values.clusters }}
            {{- if $c.existingTLSSecret }}
            - name: {{ printf "tls-%s" $c.id }}
              mountPath: {{ printf "/etc/pgao-tls/%s" $c.id }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pgao.fullname" . }}-config
        {{- range $i, $c := .Values.clusters }}
        {{- if $c.existingTLSSecret }}
        - name: {{ printf "tls-%s" $c.id }}
          secret:
            secretName: {{ $c.existingTLSSecret }}
            # 0400 octal = 256: read-only for the pgao user, no group/world
            defaultMode: 256
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}

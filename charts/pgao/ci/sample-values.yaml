# Values used by `helm lint` + `helm template` in CI. Mirrors the
# minimum a real deployment needs.

clusters:
  - id: ci
    name: CI cluster
    host: postgres.example.com
    user: pgao_monitor
    database: postgres
    existingPasswordSecret: ci-pg-credentials
    passwordSecretKey: password
  # Second cluster exercises the TLS path so kubeconform validates the
  # extra Secret volume / mount + ssl_* keys in the rendered config.
  - id: ci-tls
    name: CI TLS cluster
    host: postgres-tls.example.com
    user: pgao_monitor
    database: postgres
    ssl_mode: verify-full
    sslServerName: postgres.internal
    existingPasswordSecret: ci-pg-credentials
    passwordSecretKey: password
    existingTLSSecret: ci-pg-tls

auth:
  enabled: true
  existingSecret: ci-pgao-auth
  secretKey: api-key

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: pgao.ci.example.com
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

# Exercise the leader-election templates in CI: Role + RoleBinding +
# automountServiceAccountToken=true + downward API env + config block.
leaderElection:
  enabled: true
